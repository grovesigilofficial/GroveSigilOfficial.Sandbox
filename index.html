<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grove</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#0b0f0d;

    min-height:100vh;

    font-family:Arial,Helvetica,sans-serif;

}


header{

    display:flex;

    justify-content:flex-end;

    gap:12px;

    padding:24px;

}


.console,
.signup{

    color:#8f9893;

    text-decoration:none;

    border:1px solid #232b27;

    padding:10px 16px;

    border-radius:8px;

    transition:.2s;

}


.console:hover,
.signup:hover{

    color:#2f6e4a;

    border-color:#2f6e4a;

}


main{

    min-height:calc(100vh - 72px);

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    gap:30px;

}


h1{

    color:#2f6e4a;

    font-size:5rem;

    text-shadow:
        0 0 10px rgba(47,110,74,.55),
        0 0 25px rgba(47,110,74,.30);

}


.links{

    display:flex;

    gap:15px;

}


</style>

</head>

<body>


<header>

    <a href="console-login.html" class="console">

        Login

    </a>


    <a href="console-signup.html" class="signup">

        Create Account

    </a>

</header>



<main>

    <h1>
        Grove
    </h1>


</main>



</body>
</html>
