<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grove</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{

            --bg:#0b0f0d;
            --forest:#2f6e4a;

        }

        body{

            background:var(--bg);

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            font-family:Arial,Helvetica,sans-serif;

        }

        h1{

            color:var(--forest);

            font-size:clamp(3rem,8vw,5rem);

            letter-spacing:2px;

            text-shadow:
                0 0 8px rgba(47,110,74,.55),
                0 0 18px rgba(47,110,74,.35),
                0 0 32px rgba(47,110,74,.18);

        }

    </style>

</head>

<body>

    <h1>Grove</h1>

</body>
</html>
