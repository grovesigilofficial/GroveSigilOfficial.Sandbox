<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grove Team Dashboard</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    min-height:100vh;
    background:#0b0f0d;
    color:#d8ddd9;
    font-family:Arial,Helvetica,sans-serif;
    padding:40px;

}



.container{

    max-width:900px;
    margin:auto;

}



header{

    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:40px;

}



h1{

    color:#2f6e4a;

    text-shadow:
    0 0 8px rgba(47,110,74,.45),
    0 0 18px rgba(47,110,74,.20);

}




button{

    background:#2f6e4a;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;

}



button:hover{

    opacity:.85;

}




.card{

    background:#101512;
    border:1px solid #232b27;
    border-radius:16px;
    padding:30px;
    margin-bottom:20px;

}




.card h2{

    margin-bottom:15px;

}




.card p{

    color:#8f9893;
    margin-bottom:10px;

}




.status{

    color:#2f6e4a;

}



.online-box{

    display:flex;
    align-items:center;
    gap:10px;
    margin-top:15px;

}



.online-light{

    position:relative;

    width:14px;
    height:14px;

    border-radius:50%;

    background:#2f6e4a;

    box-shadow:
    0 0 10px rgba(47,110,74,.8);

}



.online-light::before{

    content:"";

    position:absolute;

    width:22px;
    height:22px;

    left:-4px;
    top:-4px;

    border-radius:50%;

    background:rgba(47,110,74,.35);

    animation:pulse 2s infinite;

}



@keyframes pulse{


    0%{

        transform:scale(.8);

        opacity:.8;

    }


    50%{

        transform:scale(1.4);

        opacity:.25;

    }


    100%{

        transform:scale(.8);

        opacity:.8;

    }


}




.online-text{

    color:#8f9893;

}



.last-seen{

    color:#8f9893;

    font-size:.9rem;

}



</style>


</head>


<body>



<div class="container">



<header>


<h1>
Grove Team
</h1>


<button id="logout">

Logout

</button>



</header>





<div class="card">


<h2 id="team-name">

Loading team member...

</h2>



<p id="team-email">

Loading email...

</p>



<p id="team-role">

Loading role...

</p>



<div class="online-box">

<div id="online-light" class="online-light"></div>

<p id="online-text" class="online-text">

Checking status...

</p>

</div>



<p id="last-seen" class="last-seen">

Loading last seen...

</p>



<p class="status">

✓ Grove Team Access Active

</p>



</div>





<div class="card">


<h2>

Team Space

</h2>


<p>

Welcome to the Grove team. More contributor tools will appear here as Grove grows.

</p>


</div>





</div>






<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/team-dashboard.js"></script>



</body>

    </html>
