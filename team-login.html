<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grove Team Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;
    background:#0b0f0d;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}


.card{

    width:90%;
    max-width:420px;
    background:#111614;
    border:1px solid #232b27;
    border-radius:16px;
    padding:35px;

}


h1{

    text-align:center;
    color:#2f6e4a;
    margin-bottom:15px;

}


p{

    text-align:center;
    color:#8f9893;
    margin-bottom:25px;

}


input{

    width:100%;
    padding:14px;
    margin-bottom:15px;
    background:#0d1110;
    border:1px solid #232b27;
    border-radius:10px;
    color:white;

}


button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2f6e4a;
    color:white;
    cursor:pointer;
    font-weight:bold;

}


#message{

    margin-top:15px;
    text-align:center;

}

</style>

</head>


<body>


<div class="card">


<h1>
Grove Team
</h1>


<p>
Moderator and contributor access
</p>



<input
id="email"
type="email"
placeholder="Email"
>


<input
id="password"
type="password"
placeholder="Password"
>



<button id="login">
Login
</button>



<div id="message"></div>



</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/team-login.js"></script>


</body>

  </html>
