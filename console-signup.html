<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Console Signup • Grove</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#0b0f0d;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, Helvetica, sans-serif;
    color:white;
}

.card{
    width:100%;
    max-width:420px;
    background:#111614;
    border:1px solid #232b27;
    border-radius:16px;
    padding:36px;
}

h1{
    text-align:center;
    color:#2f6e4a;
    margin-bottom:12px;
}

p{
    text-align:center;
    color:#8f9893;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    background:#0d1110;
    border:1px solid #232b27;
    border-radius:10px;
    color:white;
}

button{
    width:100%;
    padding:14px;
    background:#2f6e4a;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

#message{
    margin-top:20px;
    text-align:center;
    color:#8f9893;
}

</style>

</head>

<body>


<div class="card">

<h1>
Create Account
</h1>

<p>
Confirm your email to activate access.
</p>


<form id="signupForm">

<input
id="email"
type="email"
placeholder="Email"
required
>


<input
id="password"
type="password"
placeholder="Password"
required
>


<button type="submit">
Create Account
</button>


</form>


<div id="message"></div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/console-signup.js"></script>


</body>

</html>
