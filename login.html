<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login • Grove</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    min-height:100vh;
    background:#0b0f0d;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
    color:#d8ddd9;

}


.container{

    width:350px;
    padding:35px;
    background:#101512;
    border:1px solid #232b27;
    border-radius:12px;

}


h1{

    text-align:center;
    color:#2f6e4a;
    margin-bottom:25px;

}



input{

    width:100%;
    padding:12px;
    margin-bottom:15px;
    background:#0b0f0d;
    border:1px solid #232b27;
    border-radius:8px;
    color:white;

}



button{

    width:100%;
    padding:12px;
    background:#2f6e4a;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;

}



button:hover{

    opacity:.85;

}



.message{

    margin-top:15px;
    text-align:center;
    font-size:.9rem;

}



.signup-link{

    display:block;
    margin-top:20px;
    text-align:center;
    color:#8f9893;
    text-decoration:none;

}


.signup-link:hover{

    color:#2f6e4a;

}


</style>

</head>


<body>


<div class="container">


<h1>
Login
</h1>



<input
id="email"
type="email"
placeholder="Email"
>



<input
id="password"
type="password"
placeholder="Password"
>



<button id="login">

Login

</button>



<div id="message" class="message"></div>



<a href="signup.html" class="signup-link">

Need an account? Create one

</a>



</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/login.js"></script>


</body>

  </html>
