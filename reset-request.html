<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password • Grove</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    :root{
        --bg:#0b0f0d;
        --card:#111614;
        --border:#232b27;
        --accent:#2f6e4a;
        --text:#ffffff;
        --muted:#8f9893;
    }

    body{
        min-height:100vh;
        background:var(--bg);
        display:flex;
        justify-content:center;
        align-items:center;
        font-family:Arial, Helvetica, sans-serif;
        color:var(--text);
        padding:24px;
    }

    .card{
        width:100%;
        max-width:420px;
        background:var(--card);
        border:1px solid var(--border);
        border-radius:16px;
        padding:36px;
        box-shadow:0 0 30px rgba(47,110,74,.08);
    }

    h1{
        text-align:center;
        color:var(--accent);
        margin-bottom:12px;
        text-shadow:
            0 0 8px rgba(47,110,74,.45),
            0 0 18px rgba(47,110,74,.20);
    }

    p{
        text-align:center;
        color:var(--muted);
        margin-bottom:28px;
        font-size:.9rem;
        line-height:1.5;
    }

    input{
        width:100%;
        padding:14px;
        margin-bottom:18px;
        background:#0d1110;
        border:1px solid var(--border);
        border-radius:10px;
        color:white;
        font-size:15px;
    }

    input:focus{
        outline:none;
        border-color:var(--accent);
    }

    button{
        width:100%;
        padding:14px;
        background:var(--accent);
        color:#08110c;
        border:none;
        border-radius:10px;
        cursor:pointer;
        font-size:15px;
        font-weight:bold;
    }

    button:hover{
        filter:brightness(1.05);
    }

    button:disabled{
        opacity:.6;
        cursor:not-allowed;
    }

    #message{
        margin-top:18px;
        margin-bottom:0;
    }

    .back{
        display:block;
        margin-top:24px;
        text-align:center;
        color:var(--muted);
        text-decoration:none;
    }

    .back:hover{
        color:var(--accent);
    }

</style>
```

</head>

<body>

<div class="card">

```
<h1>Reset Password</h1>

<p>
    Enter your Grove email address and we'll send
    you a secure password reset link.
</p>

<form id="resetForm">

    <input
        id="email"
        type="email"
        placeholder="Email"
        required
    >

    <button
        id="resetButton"
        type="submit"
    >
        Send Reset Link
    </button>

</form>

<p id="message"></p>

<a
    href="console-login.html"
    class="back"
>
    ← Back to Console Login
</a>
```

</div>

<!-- Supabase Library -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Grove -->

<script src="js/supabase.js"></script>

<!-- Password Reset -->

<script src="js/reset-request.js"></script>

</body>

</html>
