<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grove Moderator Console</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#0b0f0d;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#d8ddd9;

}


.container{

    width:90%;
    max-width:900px;
    margin:40px auto;

}


h1{

    color:#2f6e4a;
    text-align:center;
    margin-bottom:30px;

}


.card{

    background:#101512;
    border:1px solid #232b27;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;

}


.card p{

    margin-bottom:10px;
    color:#b5beb9;

}


.status{

    color:#2f6e4a;

}


button{

    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#2f6e4a;
    color:white;

}


button:hover{

    opacity:.8;

}


</style>

</head>


<body>


<div class="container">


<h1>
Grove Moderator Applications
</h1>


<div id="applications">

Loading applications...

</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/moderatorConsole.js"></script>


</body>

</html>
