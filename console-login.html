<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#0b0f0d;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Arial,Helvetica,sans-serif;

}

.card{

    width:400px;

    background:#111614;

    border:1px solid #232b27;

    border-radius:16px;

    padding:40px;

}

h1{

    color:#2f6e4a;

    text-align:center;

    margin-bottom:30px;

}

input{

    width:100%;

    padding:14px;

    margin-bottom:16px;

    background:#0d1110;

    color:white;

    border:1px solid #232b27;

    border-radius:10px;

}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#2f6e4a;

    cursor:pointer;

    font-weight:bold;

}

</style>

</head>

<body>

<div class="card">

<h1>Console</h1>

<form>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button type="submit">

Sign In

</button>

</form>

</div>

</body>
</html>
