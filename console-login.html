<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Console • Grove</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-card">

        <h1>Console</h1>

        <p class="subtitle">
            Administrator Access
        </p>

        <form id="loginForm">

            <input
                id="email"
                type="email"
                placeholder="Email"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Sign In
            </button>

        </form>

        <a href="index.html" class="back-link">
            ← Return to Grove
        </a>

    </div>

</body>
</html>
